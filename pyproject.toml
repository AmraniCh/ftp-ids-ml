[project]
name = "ftp-ids-ml"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "scikit-learn",
    "joblib",
    "flask",
    "numpy",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "ruff",
    "djlint",
    "pytest",
]

[project.scripts]
ftp-ids = "ftp_ids.cli:main"

[tool.setuptools.package-data]
"ftp_ids.dashboard" = ["templates/**"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
ignore = [
    "B006",     # rule_alerts=[] defaults are only read, never mutated
    "PLW1510",  # subprocess.run return codes are checked by hand
    "SIM117",   # nested with blocks read fine
    "PERF402",  # plain for loops are clearer than list(...) here
    "PLR0402",  # "import ftp_ids.config as config" is fine
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.djlint]
profile = "jinja"
indent = 4
max_line_length = 120
