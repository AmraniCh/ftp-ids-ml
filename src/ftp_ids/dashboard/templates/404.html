{% extends "base.html" %}
{% block title %}Not found · FTPGuard{% endblock %}

{% block content %}
<div class="border border-gray-800 bg-gray-900 p-16 text-center">
    <div class="text-amber-500 text-5xl font-bold mb-4 tabular-nums">404</div>
    <h2 class="text-lg text-white mb-2">Page not found</h2>
    <p class="text-sm text-gray-500 mb-6">
        The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="{{ url_for('index') }}"
       class="inline-block px-4 py-2 text-xs border border-gray-800 hover:border-amber-500 hover:text-amber-500 text-gray-400 transition-colors">
        ← back to dashboard
    </a>
</div>
{% endblock %}
